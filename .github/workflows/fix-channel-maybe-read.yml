name: Apply Channel maybeRead fix

on:
  push:
    branches:
      - agent/fix-channel-maybe-read

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-channel-maybe-read
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node scripts/fix-channel-maybe-read.mjs

      - name: Commit source fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/channel/src/channel.ts
          git commit -m "fix Channel maybeRead result handling"
          git push
