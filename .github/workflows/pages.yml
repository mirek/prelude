name: Pages

# Builds the documentation site (scripts/build-site.mjs: README guides, TypeDoc
# API reference, llms.txt and the agent skill under /.well-known/agent-skills/)
# and deploys it to GitHub Pages on every push to main.
#
# SITE_URL comes from configure-pages, so the base path is right for the
# project page (https://mirekrusin.com/prelude/) and for a custom domain
# (add a CNAME in the repository Pages settings; nothing here changes).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: pnpm site:build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Check well-known paths survived
        run: |
          test -f site/.nojekyll
          test -f site/.well-known/agent-skills/index.json
          test -f site/.well-known/agent-skills/prelude/SKILL.md
          test -f site/llms.txt
          test -f site/api/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
